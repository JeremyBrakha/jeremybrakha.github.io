<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The query holds the bank's authorization code: no other site may see it. -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Retour à l’app</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f9fc; --fg: #1a1c20; --muted: #5b6070; --accent: #2b5bb8; --on-accent: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111318; --fg: #e3e5ec; --muted: #a9adba; --accent: #aac7ff; --on-accent: #0a305f; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 28rem; padding: 24px 16px; text-align: center; }
    p { color: var(--muted); }
    a.button { display: inline-block; margin-top: 8px; padding: 12px 24px; border-radius: 999px; background: var(--accent);
               color: var(--on-accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Retour à l’app</h1>
    <p id="message">L’accord donné à la banque revient vers l’app Finances.</p>
    <a class="button" id="back" href="#" hidden>Ouvrir l’app</a>
  </main>
  <script>
    // Enable Banking sends the bank's answer here, in the query: ?code=…&state=… or ?error=…&state=….
    // When Android has not handed this address to the app on its own, the page passes the answer on to it.
    (function () {
      var query = window.location.search;
      if (!/[?&]state=/.test(query)) {
        document.getElementById('message').textContent = 'Cette page ne sert qu’au retour de la banque vers l’app.';
        return;
      }
      var app = 'intent://enable-banking/callback' + query +
        '#Intent;scheme=io.github.jeremybrakha.gestionbudget;package=io.github.jeremybrakha.gestionbudget;end';
      var back = document.getElementById('back');
      back.href = app;
      back.hidden = false;
      window.location.replace(app);
    })();
  </script>
</body>
</html>
